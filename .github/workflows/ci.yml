name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Skill (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Check generated agent commands
        run: python tools/sync_commands.py --check
      - name: Validate skill and repository links
        run: python tools/validate_skill.py

  server:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: python -m pip install -r chatgpt/server/requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Validate skill and repository links
        run: python tools/validate_skill.py
