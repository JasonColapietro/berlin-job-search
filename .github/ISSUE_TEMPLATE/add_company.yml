name: Add a company board
description: Suggest a public company ATS board for the search catalogue.
title: "[Company]: "
labels:
  - source
body:
  - type: markdown
    attributes:
      value: |
        Suggest only a public career board that can be accessed without an account or credentials.
  - type: input
    id: company
    attributes:
      label: Company name
    validations:
      required: true
  - type: input
    id: careers_url
    attributes:
      label: Public careers URL
      placeholder: https://careers.example.com
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: Main city or cities
    validations:
      required: true
  - type: input
    id: ats
    attributes:
      label: ATS and public slug
      description: Greenhouse, Lever, Ashby, Personio, SmartRecruiters, Recruitee, Workable or JOIN.
    validations:
      required: false
  - type: input
    id: verified_date
    attributes:
      label: Date a public fetch returned a job
      placeholder: YYYY-MM-DD
    validations:
      required: true
