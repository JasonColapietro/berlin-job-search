name: Add a job source
description: Propose a public job source or API integration.
title: "[Source]: "
labels:
  - source
body:
  - type: markdown
    attributes:
      value: |
        Provide public documentation and terms. Do not include credentials, private postings or personal application data.
  - type: input
    id: source_name
    attributes:
      label: Source name
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Public API or source URL
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Geographic and job coverage
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Access, terms and request limits
      description: Confirm no login or credential is required and note the public terms.
    validations:
      required: true
  - type: input
    id: verified_date
    attributes:
      label: Date verified
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: fictional_fixture
    attributes:
      label: Suggested fictional test fixture
    validations:
      required: false
